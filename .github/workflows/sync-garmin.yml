name: Sync Garmin & Deploy

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger button

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Garmin data
        env:
          # A saved session token — a fresh email/password login from GitHub's
          # datacenter IPs is blocked by Garmin. Regenerate locally when it
          # expires: `node scripts/fetch-garmin.js --export-token`.
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: node scripts/fetch-garmin.js

      - name: Build site
        run: npx @11ty/eleventy

      - name: Deploy to GitHub Pages
        run: |
          cp -r dist/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-sync Garmin data $(date -u +"%Y-%m-%d %H:%M UTC")" && git push)
